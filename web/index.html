<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="musicapp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>musicapp</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script>
    // Descarga el .zip, lo descomprime en el navegador, y dispara la
    // descarga del .apk puro (el usuario nunca ve ni maneja el .zip).
    async function descargarApkDesdeZip(zipUrl, apkFileName) {
      const respuesta = await fetch(zipUrl);
      if (!respuesta.ok) throw new Error('No se pudo descargar: ' + respuesta.status);
      const zipBlob = await respuesta.blob();
      const zip = await JSZip.loadAsync(zipBlob);

      // Busca el primer archivo que termine en .apk dentro del zip.
      const nombreEnZip = Object.keys(zip.files).find(n => n.toLowerCase().endsWith('.apk'));
      if (!nombreEnZip) throw new Error('El zip no contiene un .apk');

      const apkBlob = await zip.files[nombreEnZip].async('blob');
      const url = URL.createObjectURL(apkBlob);

      const a = document.createElement('a');
      a.href = url;
      a.download = apkFileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
